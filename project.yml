# XcodeGen spec. Regenerate with:  tools/xcodegen/bin/xcodegen generate && pod install
# Signing team and bundle prefix come ONLY from Local.xcconfig (git-ignored).
name: GreekInk

options:
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # CocoaPods 1.15 can't read Xcode 16.3+ project format (objectVersion 77). Downgrade to 60 (Xcode 15), which Xcode 27 still opens fine.
  postGenCommand: sed -i '' -e 's/objectVersion = 77;/objectVersion = 60;/' -e '/preferredProjectObjectVersion/d' GreekInk.xcodeproj/project.pbxproj

fileGroups:
  - Local.xcconfig
  - Local.xcconfig.example
  - Podfile
  - README.md
  - CLAUDE.md

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"            # iPad only
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately NOT set here. It comes from Local.xcconfig.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # CocoaPods scripts write into Pods/
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GreekInk:
    type: application
    platform: iOS
    sources:
      - GreekInk
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).greekink
        PRODUCT_NAME: GreekInk
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    info:
      path: GreekInk/Info.plist
      properties:
        CFBundleDisplayName: GreekInk
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Lets the Files app see Documents/misreads.json
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Read at runtime by Shared/AppGroup.swift. Expanded by Xcode at build time.
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).greekink
    entitlements:
      path: GreekInk/GreekInk.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).greekink
    dependencies:
      - target: GreekInkKeyboard

  GreekInkKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - GreekInkKeyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).greekink.keyboard
        PRODUCT_NAME: GreekInkKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: GreekInkKeyboard/Info.plist
      properties:
        CFBundleDisplayName: GreekInk
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).greekink
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: el
            # Phase 0: Full Access OFF, so we learn what the App Group allows without it.
            RequestsOpenAccess: false
    entitlements:
      path: GreekInkKeyboard/GreekInkKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).greekink

schemes:
  GreekInk:
    build:
      targets:
        GreekInk: all
    run:
      config: Debug
    archive:
      config: Release
